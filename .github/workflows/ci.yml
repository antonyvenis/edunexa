name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: edunexa, POSTGRES_USER: edunexa, POSTGRES_PASSWORD: edunexa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunexa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://edunexa:edunexa@localhost:5432/edunexa
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
